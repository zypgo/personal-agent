[project]
name = "personal-agent"
version = "0.1.0"
description = "A local, always-on personal agent: OpenAI models, Anthropic's agent-engineering practices."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Engine. 0.x API still moves: pin the minor, upgrade only through the eval suite.
    "openai-agents>=0.24,<0.25",
    "openai>=3,<4",
    "httpx>=0.28",
    # Web channel (starlette is already a transitive dependency of the SDK).
    "starlette>=1.3.1",
    "uvicorn>=0.30",
    # CLI (typer brings rich), scheduling, config, skills, onboarding QR.
    "typer>=0.12",
    "click>=8.1",
    "croniter>=6",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "qrcode>=8",
]

[project.optional-dependencies]
# Optional vector search for memory/history (FTS5 works without it).
vector = ["numpy>=2"]
# Docker sandbox backend helper (the CLI `docker` binary is used directly; this is optional).
docker = ["docker>=6.1"]

[project.scripts]
pa = "personal_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "E501",   # `ruff format` wraps code; long strings and comments (exact tool texts) are fine
    "S101",   # asserts are fine in tests and for internal invariants
    "S603",   # subprocess is intentional (sandboxed execution)
    "S607",
    "S608",   # SQL is built from fixed fragments with bound parameters
    "RUF012",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "B011"]
