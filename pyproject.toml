[project]
name = "personal-agent"
version = "0.5.0"
description = "A personal AI assistant for everyday tasks, lasting memory, and trusted agent collaboration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Engine. 0.x API still moves: pin the minor, upgrade only through the eval suite.
    "openai-agents>=0.24,<0.25",
    "openai>=3,<4",
    # The egress gate (security/ssrf.py) plugs into httpcore's network-backend interface and
    # rebuilds httpx's connection pool, so both are pinned: an upgrade must pass tests/test_ssrf.py.
    "httpx[socks]>=0.28.1,<0.29",   # [socks]: Telegram is often reached through a SOCKS proxy
    "httpcore>=1.0.9,<1.1",
    # DingTalk Stream uses the async client; explicit even when the model SDK also needs it.
    "websockets>=16.1.1,<17",
    # Web channel (starlette is already a transitive dependency of the SDK). python-multipart is
    # what starlette's request.form() needs for the page's message and picture uploads.
    "starlette>=1.3.1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    # CLI (typer brings rich), scheduling, config, skills, onboarding QR.
    "typer>=0.12",
    "click>=8.1",
    "croniter>=6",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "qrcode>=8",
    "mcp>=2.3,<3",
    "agent-client-protocol>=1.0,<1.1",
    "tomlkit>=0.13",
    "fastapi>=0.163.1,<0.164",
    "pydantic>=2.14.3,<3",
    "docker>=7.2,<8",
    "trafilatura>=2.3.1,<2.4",
    "pysocks>=1.7.1,<2",
    "psutil>=7.2.2,<8",
]

[project.scripts]
pa = "personal_agent.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8",
    "types-croniter>=6.2.4.20261006",
    "types-docker>=7.1,<8",
    "types-psutil>=7.2.2.20261111",
    "types-pyyaml>=6.0.12.20261113",
    "types-qrcode>=8.2.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_agent"]

[tool.hatch.build.targets.sdist]
# A list of what belongs to the project, not of what does not. `references/` holds clones of
# other people's projects (see its README): study material, whose `.env.example` files used to
# end up in the archive because `.gitignore` re-includes that name and hatch lets it win over an
# `exclude`.
include = ["/src", "/tests", "/docs", "/scripts", "/examples/muse", "/examples/grok", "/frontend", "/package.json", "/package-lock.json", "/tsconfig.json", "/README.md", "/uv.lock", "/.env.example", "/Dockerfile", "/.dockerignore", "/railway.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*",
    # Something opened and never closed (a database, a file, a socket) is a bug, not noise.
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "E501",   # `ruff format` wraps code; long strings and comments (exact tool texts) are fine
    "S101",   # asserts are fine in tests and for internal invariants
    "S603",   # subprocess is intentional (sandboxed execution)
    "S607",
    "S608",   # SQL is built from fixed fragments with bound parameters
    "RUF012",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108", "B011"]  # S104: addresses under test, never binds

[tool.mypy]
python_version = "3.11"
files = ["src/personal_agent"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
