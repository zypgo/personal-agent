id: preferences-are-followed
title: The owner's standing preferences shape the answer, and the agent leaves them alone
tags: [memory]
about: >
  The owner's standing instructions say: answer in Chinese, briefly. A question in English must still
  get a Chinese answer, and the file the owner wrote must be exactly as they left it afterwards.
seed:
  preferences:
    instructions.md: |
      # How I like to be answered
      - Always answer me in Chinese (中文), even when I write in English.
      - Keep it to two short sentences.
steps:
  - id: ask
    message: What is a good way to start learning to cook?
checks:
  - {kind: says, step: ask, pattern: "[\u4e00-\u9fff]{4,}"}
  # The owner wrote "two short sentences", not a number of characters. 160 leaves room for what a model
  # that follows that rule really writes (a live run gave two sentences of 102 characters, which a limit
  # of 100 failed), while a paragraph or a list still fails on length or on sentence count.
  - {id: chinese-and-brief, kind: response_style, step: ask, min_han_share: 0.8, max_chars: 160, max_sentences: 2}
  - {kind: memory_untouched, paths: [preferences/instructions.md]}
  - {kind: max_messages, limit: 1}
  - {kind: spend_under, usd: 0.25}
mock:
  good:
    ask:
      - say: "先从最简单的家常菜入手，比如番茄炒蛋、蒜蓉青菜和葱油拌面，把火候、放盐和下锅顺序练熟，开火前先把食材备齐。然后每周固定做三四次，照着一个靠谱的视频或食谱慢慢增加新菜，坚持一两个月就会明显进步，味道也会越来越稳。"
  bad:
    - name: answers-in-english
      fails: [says-ask, chinese-and-brief]
      script:
        ask:
          - say: "Start with simple dishes like scrambled eggs and soup."
    - name: says-it-twice
      fails: [max_messages]
      script:
        ask:
          - send: "先从简单的家常菜开始，比如炒鸡蛋。"
          - say: "再补充一点：每周固定做几次，慢慢就熟练了。"
    - name: chinese-prefix-hides-an-english-answer
      fails: [chinese-and-brief]
      script:
        ask:
          - say: "先学家常菜。Start with scrambled eggs, then learn knife skills, soups, roasting, and sauces. Practice every day."
    - name: too-many-chinese-sentences
      fails: [chinese-and-brief]
      script:
        ask:
          - say: "先学炒蛋。然后学切菜。再试煮汤。每天练习。最后请朋友尝尝。"
    - name: two-sentences-that-run-on
      fails: [chinese-and-brief]
      script:
        ask:
          - say: "先从最简单的家常菜入手，比如番茄炒蛋、蒜蓉青菜和葱油拌面，把火候、放盐和下锅顺序练熟，开火前先把食材备齐，切好的菜按下锅的先后摆放在盘子里，调料也提前量好放在手边，这样做起来不会手忙脚乱。然后每周固定做三四次，照着一个靠谱的视频或食谱慢慢增加新菜，每次只改变一两个地方，记下火候和用量，坚持一两个月就会明显进步，味道也会越来越稳，慢慢就有了自己的习惯。"
