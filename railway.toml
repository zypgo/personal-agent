# Compatibility for existing services using legacy Config as Code.
# docs/RAILWAY.md also lists the equivalent service settings and current migration caveat.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 90
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
sleepApplication = false
drainingSeconds = "45"
